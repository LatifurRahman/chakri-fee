name: CI/CD
on:
  push:
    branches: [main, "feat/cloudflare-workers-hyperdrive"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fee_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fee_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint -- --max-warnings=0
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build
      - run: npm run types:cloudflare
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:browser
      - name: Firefox regression
        run: BROWSER_NAME=firefox npm run test:browser
      - run: npm run test:browser:production
      - run: npm run check:cloudflare
      - run: npm run build:cloudflare
      - name: Workers packaging validation (no upload)
        run: npx wrangler deploy --dry-run --config dist/server/wrangler.json
      - name: Compiled Workers runtime regression (workerd + temporary PostgreSQL)
        run: npm run test:cloudflare
      - name: Save browser regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-${{ github.sha }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: ignore
  deployment-readiness:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Report deployment configuration
        env:
          ENABLED: ${{ vars.ENABLE_PRODUCTION_DEPLOY || 'false' }}
        run: |
          if [ "$ENABLED" = "true" ]; then
            echo "Production deployment enabled; credentials and environment gates follow." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "CI passed. CD is NOT configured: hosting and production database setup is pending. No public deployment was performed." >> "$GITHUB_STEP_SUMMARY"
          fi
  deploy:
    needs: [check, deployment-readiness]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ENABLE_PRODUCTION_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    env:
      ENABLE_PRODUCTION_DEPLOY: ${{ vars.ENABLE_PRODUCTION_DEPLOY }}
      DEPLOYMENT_TARGET: cloudflare
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      HYPERDRIVE_ID: ${{ vars.HYPERDRIVE_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
      TURNSTILE_HOSTNAME: ${{ vars.TURNSTILE_HOSTNAME }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      ANTI_ABUSE_SECRET: ${{ secrets.ANTI_ABUSE_SECRET }}
      ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
      ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
      NORMAL_FEE_MAX: ${{ vars.NORMAL_FEE_MAX || '10000' }}
      LEADERBOARD_MIN_REPORTS: ${{ vars.LEADERBOARD_MIN_REPORTS || '5' }}
      DEV_BYPASS_TURNSTILE: "false"
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate production configuration (without printing secrets)
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$DATABASE_URL"
          node --import tsx scripts/check-production.ts
      - name: Build production Worker with canonical origin and public CAPTCHA key
        run: npm run build:cloudflare
      - name: Verify Hyperdrive points to the migration database and disables query caching
        run: node --import tsx scripts/check-cloudflare.ts
      - name: Run existing transactional migrations against the Supabase origin
        run: npm run db:migrate
      - name: Deploy verified Worker via Wrangler with version-bound secrets
        run: npm run deploy:cloudflare
      - name: Read-only HTTPS production smoke
        env:
          DEPLOYMENT_URL: ${{ vars.SITE_URL }}
        run: npm run test:smoke
