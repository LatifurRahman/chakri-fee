services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fee_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["fee_db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fee_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  fee_db:
